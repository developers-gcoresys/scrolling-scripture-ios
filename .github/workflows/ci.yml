name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Shared core checks
        working-directory: ScriptureCore
        run: swift run CoreChecks
      - name: Widget verse drift check
        run: node tools/build-widget-verses.mjs --check
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Regenerate project
        run: xcodegen generate && git diff --exit-code -- ScrollingScripture.xcodeproj
      - name: Build for simulator
        run: |
          xcodebuild \
            -project ScrollingScripture.xcodeproj \
            -scheme ScrollingBible \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
